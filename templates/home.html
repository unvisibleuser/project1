{% extends "base.html" %}
{% block content %}
<div class="top-bar">
  <h2>Gemini Mailer</h2>
  <div>
    <span>{{ request.user.email }}</span>
    &nbsp;|&nbsp;
    <a href="{% url 'account_logout' %}">Logout</a>
  </div>
</div>

<p>Type a prompt below. It will be sent to Gemini, and the response will be emailed to
  <strong>{{ request.user.email }}</strong>.</p>

<textarea id="prompt" placeholder="Type your prompt here..."></textarea><br>
<button id="submitBtn" onclick="submitPrompt()">Generate & Email</button>

<div id="status"></div>
<div id="result" class="result-box" style="display:none;"></div>

<script>
function getCookie(name) {
  const match = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
  return match ? match.pop() : '';
}

async function submitPrompt() {
  const prompt = document.getElementById('prompt').value.trim();
  const statusEl = document.getElementById('status');
  const resultEl = document.getElementById('result');
  const btn = document.getElementById('submitBtn');

  if (!prompt) {
    statusEl.innerHTML = '<p class="error">Please enter a prompt.</p>';
    return;
  }

  btn.disabled = true;
  statusEl.textContent = 'Generating response and sending email...';
  resultEl.style.display = 'none';

  try {
    const res = await fetch('/api/generate/', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRFToken': getCookie('csrftoken'),
      },
      body: JSON.stringify({ prompt }),
    });
    const data = await res.json();

    if (!res.ok) {
      statusEl.innerHTML = '<p class="error">' + (data.detail || 'Something went wrong.') + '</p>';
    } else {
      statusEl.textContent = data.email_sent
        ? 'Done! Response emailed to you.'
        : 'Response generated, but email may have failed: ' + (data.email_warning || '');
      resultEl.style.display = 'block';
      resultEl.textContent = data.response;
    }
  } catch (err) {
    statusEl.innerHTML = '<p class="error">Request failed: ' + err.message + '</p>';
  } finally {
    btn.disabled = false;
  }
}
</script>
{% endblock %}
