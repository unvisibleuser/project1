<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gemini Mailer</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 16px; }
  textarea { width: 100%; height: 120px; padding: 8px; font-size: 14px; box-sizing: border-box; }
  button { padding: 8px 16px; margin-top: 8px; cursor: pointer; }
  .result-box { margin-top: 20px; padding: 12px; background: #f4f4f4; border-radius: 6px; white-space: pre-wrap; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .error { color: #b00020; }
</style>
</head>
<body>
{% block content %}{% endblock %}
</body>
</html>
